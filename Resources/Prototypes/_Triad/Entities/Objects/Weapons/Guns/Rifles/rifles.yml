- type: entity
  name: Misriah Autorifle (762x51mm)
  parent: [BaseWeaponRifle, BaseGunMeleeBlunt, BaseC3SyndicateContraband]
  id: WeaponRifleMMisriahAutorifle
  description: Standard issue assault rifle issued to marines and special forces; chambered in 762x51mm ammo. Produced by SESWC.
  components:
  - type: Sprite
    sprite: _Triad/Objects/Weapons/Guns/Rifles/ma5b.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Triad/Objects/Weapons/Guns/Rifles/ma5b.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 6
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  #- type: AltFireMelee - this is built into the Parent
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine762x51mmFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine762x51mmFMJ
            - Magazine762x51mmLowCapacityFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge762x51mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge762x51mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
 #- type: NFWeaponDetails  # when we get details in from frontier
 #  manufacturer: weapon-details-manufacturer-SESWC-consortium
 
- type: entity
  name: StA-52 Assault Rifle (5.56x45mm)
  parent: BaseWeaponRifle
  id: WeaponRifleStA52AssaultRifle
  description: A rugged assault rifle commonly found among Solghan remnant warbands. Designed by Stahl Arms.
  components:
  - type: Sprite
    sprite: _Triad/Objects/Weapons/Guns/Rifles/sta52.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: GunWieldBonus
    minAngle: -14
    maxAngle: -17
  - type: Gun
    minAngle: 18
    maxAngle: 35
    angleIncrease: 4
    angleDecay: 40
    fireRate: 11 # 660 rpm
    shotsPerBurst: 3
    availableModes:
    - Burst
    - FullAuto
    - SemiAuto
    soundGunshot:
      path: /Audio/_Goobstation/Weapons/Guns/Gunshots/smartgun_shoot.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: Clothing
    sprite: _Triad/Objects/Weapons/Guns/Rifles/sta52_inhands_32x.rsi
  - type: Item
    sprite: _Triad/Objects/Weapons/Guns/Rifles/sta52_inhands_32x.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: StA52Drum556x45mmFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/sfrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/hpistol_magout.ogg
        priority: 2
        whitelist:
          tags:
          - StA52Drum556x45mmFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge556x45mmFMJ
        priority: 1
        whitelist:
          tags:
          - Cartridge556x45mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 3500
    vendPrice: 9000
